<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Problem Journey Logistik</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8 px-4">

  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-gray-800">Form Problem Journey</h2>
      <p class="text-sm text-gray-500">Monitoring Logistik Ekspidisi & End of Shift</p>
    </div>

    <form id="problemForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
      
      <div>
        <label class="block text-sm font-semibold text-gray-700">Sub Category</label>
        <select name="subCategory" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
          <option value="">-- Pilih Kategori Masalah --</option>
          <option value="Keterlambatan Armada">Keterlambatan Armada</option>
          <option value="Kerusakan Unit">Kerusakan Unit (Breakdown)</option>
          <option value="Masalah Dokumen">Masalah Dokumen</option>
          <option value="Pencegatan/Pungli">Pencegatan / Pungli</option>
          <option value="Kecelakaan (Accident)">Kecelakaan (Accident)</option>
          <option value="Lain-lain">Lain-lain</option>
        </select>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700">No. Polisi (Nopol)</label>
          <input type="text" name="nopol" required placeholder="B 1234 ABC" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm uppercase">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700">No. Daftar Muatan (DM)</label>
          <input type="text" name="dm" required placeholder="DM-001" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700">No. SPM</label>
          <input type="text" name="spm" required placeholder="SPM-001" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Tanggal & Jam Kejadian</label>
        <input type="datetime-local" name="tanggalJamKejadian" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Deskripsi Masalah</label>
        <textarea id="deskripsi" name="deskripsi" rows="3" required placeholder="Jelaskan detail kronologi kejadian..." class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm"></textarea>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-500">Auto Fill Terintegrasi (Mirroring Deskripsi)</label>
        <input type="text" id="autoFillMirror" readonly placeholder="Akan terisi otomatis mengikuti Deskripsi..." class="mt-1 block w-full p-2 bg-gray-50 border border-gray-200 rounded-md text-gray-500 cursor-not-allowed text-sm">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Detail & Link Lokasi Kejadian</label>
        <input type="url" name="lokasiKejadian" required placeholder="https://maps.google.com/..." class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Dokumen Ditahan</label>
        <input type="text" name="dokumenDitahan" placeholder="Contoh: STNK, KIR, atau sampaikan 'Tidak Ada'" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700">Created By</label>
          <select id="createdBy" name="createdBy" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
            <option value="">Memuat data manpower...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700">Follow Up / Tindakan Utama</label>
          <input type="text" name="followUp" required placeholder="Contoh: Koordinasi dengan mekanik / Vendor" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
        </div>
      </div>

      <div class="pt-4">
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md shadow hover:bg-blue-700 transition duration-200">
          Kirim Laporan
        </button>
      </div>
    </form>
  </div>

  <script>
    // Fitur Auto Fill secara real-time dari Deskripsi ke field visual pendukung
    const deskripsiInput = document.getElementById('deskripsi');
    const autoFillMirror = document.getElementById('autoFillMirror');
    
    deskripsiInput.addEventListener('input', function() {
      autoFillMirror.value = this.value;
    });

    // Load data Man Power dari Sheet untuk Dropdown "Created By"
    window.addEventListener('load', function() {
      google.script.run.withSuccessHandler(function(users) {
        const select = document.getElementById('createdBy');
        select.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
        if(users.length === 0) {
          select.innerHTML = '<option value="Admin">Admin (Manual Fill)</option>';
          return;
        }
        users.forEach(function(name) {
          let opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        });
      }).getManPowerList();
    });

    // Proses Pengiriman Form
    function handleFormSubmit(event) {
      event.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Sedang Mengirim...";
      
      const form = document.getElementById('problemForm');
      
      google.script.run.withSuccessHandler(function(response) {
        btn.disabled = false;
        btn.innerText = "Kirim Laporan";
        if(response.success) {
          alert(response.message);
          form.reset();
          autoFillMirror.value = "";
        } else {
          alert("Gagal menyimpan data: " + response.message);
        }
      }).submitForm(form);
    }
  </script>
</body>
</html>
